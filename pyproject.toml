[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanbase-compete"
version = "0.1.0"
description = "Unofficial OceanBase competition submission, scoring, leaderboard and experiment CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
obcomp = "oceanbase_compete.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
