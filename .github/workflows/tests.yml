name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Verify standalone Skill entry point
        run: python skills/oceanbase-compete/scripts/obcomp.py --version
